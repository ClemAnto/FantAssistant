plugins {
    id 'com.android.application'
}

android {
    namespace 'it.fantassistant.widget'
    compileSdk 35

    defaultConfig {
        applicationId 'it.fantassistant.widget'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.2.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
