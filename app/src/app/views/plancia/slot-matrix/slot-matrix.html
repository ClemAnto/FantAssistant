<!-- UI text is ITALIAN in app/ (see app/CLAUDE.md); code and comments stay English.

     TUTTE LE 250 RIGHE A SCHERMO. La griglia e' la struttura del mercato - una rosa e' 25 uomini e un
     listone 25 SLOT da `teams` uomini, quindi una rosa e' un uomo per slot - e a estrazione libera
     qualunque ruolo puo' uscire in qualunque momento, quindi non c'e' una fase da espandere: si vede
     tutto o non si vede niente.

     OGNI BLOCCO E' LARGO UGUALE: la linea piu' lunga ne ha otto, quindi ogni linea e' tagliata su una
     griglia di otto. LO SPAZIO CHE AVANZA RESTA VUOTO (sua istruzione, 22/09/2026): portava la CODA, la
     legenda e la borsa, e tutt'e tre sono state togliute - allargare i blocchi per riempirlo direbbe
     che un portiere vale piu' schermo di un difensore, che e' proprio cio' che la griglia nega. -->
<div class="flex h-full min-h-0 flex-col gap-1.5">
  @for (role of roles; track role) {
    <div class="flex min-h-0 flex-1 gap-1.5">
      <div class="flex w-3.5 shrink-0 items-center justify-center rounded" [class]="roleTone[role]">
        <span class="text-[10px] font-bold text-page">{{ role }}</span>
      </div>

      <div class="grid min-w-0 flex-1 grid-cols-8 gap-1.5">
        @for (block of byRole().get(role); track block.id) {
          <div
            class="flex min-h-0 min-w-0 flex-col overflow-hidden rounded border bg-surface"
            [class]="blockTone(block)"
          >
            <!-- Intestazione: lo slot, quanti restano nell'urna, e la mediana della coordinata su cui
                 il blocco e' tagliato - il prezzo della stanza sul mercato, la mia max offerta sulla
                 griglia personale. Mai le due insieme: nove pixel portano tre cifre e non quattro. -->
            <div
              class="flex shrink-0 items-baseline gap-1 border-b border-border bg-control px-1.5 py-0.5"
              nz-tooltip
              [nzTooltipTitle]="blockTip(block)"
            >
              <!-- L'ETICHETTA DICE DI CHI E' IL TAGLIO: sulla griglia personale `D1` sono i miei dieci
                   e non i dieci del mercato, quindi il nome del blocco e' nel primario invece che nel
                   muto. Un colore e non una parola perche' l'intestazione e' alta nove pixel, e il
                   tooltip porta la frase intera. -->
              <span
                class="text-[9px] font-bold tracking-wide"
                [class.text-muted]="view() === 'market'"
                [class.text-primary]="view() === 'mine'"
                >{{ block.id }}</span
              >
              <span class="ml-auto text-[11px] font-bold tabular-nums text-fg">{{
                block.left
              }}</span>
              @let median = headline(block);
              <span class="text-[9px] tabular-nums text-muted">{{
                median == null ? '·' : (median | number: '1.0-0')
              }}</span>
            </div>

            <!-- I DIECI NOMI, e NIENTE TOOLTIP (sua istruzione, 03/09/2026: «è fastidioso»): su una
                 plancia di 250 righe un pannello che si apre passando copre proprio le righe che stai
                 leggendo. Al suo posto l'hover EVIDENZIA nella mappa i due uomini che comprerebbe
                 invece di lui - che è la stessa informazione, mostrata dove i due uomini vivono
                 invece che riscritta in un riquadro sopra.

                 TRE NUMERI E OGNUNO DICE UNA COSA SOLA: quanto rende sopra il sei per partita
                 giocata, fra parentesi le partite attese, e a destra la max offerta (o il prezzo
                 pagato, con la barra del proprietario a dirlo). La versione intermedia li fondeva in
                 una cifra a giornata e lui l'ha ritirata - «i punteggi non tornano, meglio il delta
                 medio a partita e tra parentesi il num di partite atteso» - perché il riferimento
                 «sei in TUTTE le giornate» non lo raggiunge nessuno (la colonna diventava −247 su un
                 attaccante da 19 presenze) e perché due fatti in una cifra non si leggono. Così
                 l'ordine del blocco, che è il valore atteso, viene SPIEGATO da quello che c'è
                 scritto: `+1,1 (33)` sopra `+1,6 (30)` si capisce a colpo d'occhio.

                 L'EVIDENZIAZIONE È UNO SFONDO E NON UN BORDO (sua istruzione, subito dopo): un bordo
                 su una riga alta dieci pixel sposta il testo e si legge come un salto, una tinta non
                 muove niente. Rosso leggerissimo, e come stile INLINE perché queste righe hanno già
                 una classe di sfondo per lo stato (mio · di un altro · in asta): due utility sulla
                 stessa proprietà si decidono sull'ordine del CSS generato e non su quale delle due è
                 legata (il difetto del 27/08), mentre un inline condizionale vince quando c'è e
                 lascia dipingere la classe quando non c'è. -->
            <div class="flex min-h-0 flex-1 flex-col">
              @for (man of block.rows; track man.id) {
                <button
                  type="button"
                  class="flex min-h-0 flex-1 items-center gap-1 pr-1 pl-0.5 text-left text-[10px] leading-none"
                  [class]="rowTone(man)"
                  [class.opacity-30]="dimmed(man)"
                  [disabled]="inert(man)"
                  (click)="press(man)"
                  (mouseenter)="hover(man)"
                  (mouseleave)="hover(null)"
                  [style.background-color]="instead(man) ? INSTEAD_TINT : null"
                >
                  <span
                    class="h-2.5 w-0.5 shrink-0 rounded-full"
                    [style.background-color]="man.ownerColour ?? 'transparent'"
                  ></span>
                  <span class="min-w-0 truncate">{{ man.name }}</span>
                  <ui-ruling-dot [playerId]="man.id" />
                  <span class="flex-1"></span>
                  <!-- LE ICONCINE, fra il nome e i numeri (operatore, 03/09/2026). Due al massimo,
                       perche' una riga e' alta 17px e la terza mangerebbe il nome: `ui-flags` taglia in
                       coda, dove i marchi sono gia' in ordine di importanza, e DICE quante ne restano
                       fuori. Quali disegnarne lo decide il menu' in barra, che e' una preferenza sola
                       per tutta l'app. -->
                  <ui-flags
                    class="shrink-0 text-[10px] leading-none"
                    [playerId]="man.id"
                    [max]="2"
                  />
                  <!-- IL NUMERO CHE SPIEGA L'ORDINE, e cambia col taglio perche' l'ordine cambia.
                       Sul mercato il blocco e' ordinato per valore atteso, quindi qui c'e' quanto
                       rende sopra il sei; sulla griglia personale l'ordine e' lo SWING (punti sopra
                       il 6 a giornata, surplus piu' costanza - l'unita' dichiarata dall'operatore il
                       07/09/2026), quindi qui c'e' quello: le due colonne parlano la stessa scala.
                       Una colonna che spiega un ordinamento deve essere quell'ordinamento - la
                       regola del 03/09, applicata al taglio nuovo. Le partite attese restano accanto
                       in tutt'e due, perche' spiegano tutt'e due i numeri. -->
                  <span class="shrink-0 tabular-nums opacity-60">{{
                    view() === 'mine'
                      ? (man.swing == null ? '·' : (man.swing | number: '1.1-1'))
                      : man.edge == null
                        ? '·'
                        : (man.edge > 0 ? '+' : '') + (man.edge | number: '1.1-1')
                  }}</span>
                  <span class="shrink-0 tabular-nums opacity-40">{{
                    man.pv == null ? '' : '(' + (man.pv | number: '1.0-0') + ')'
                  }}</span>
                  <!-- LA MAX OFFERTA, e TINTA quando e' scesa perche' di quel club ne ho gia'
                       (operatore, 08/09/2026). Lo sconto esisteva dal 04/09 e non era scritto da
                       nessuna parte: una cifra piu' bassa senza il perche' si legge come un
                       ordinamento rotto. Si tinge il NUMERO e non il nome perche' il fatto e' sulla
                       MIA rosa e non sull'uomo - l'infortunio tinge il nome, che e' suo - e solo dove
                       quella cifra E' un'offerta: su chi e' di un altro la colonna porta il prezzo
                       PAGATO, che nessuno sconto di mio ha toccato. -->
                  @let figure = shown(man);
                  <span
                    class="shrink-0 tabular-nums"
                    [class.text-warning]="man.sameClubCut > 0 && man.state !== 'altro'"
                    >{{ figure != null ? (figure | number: '1.0-0') : '—' }}</span
                  >
                </button>
              }
            </div>
          </div>
        }

        <!-- LE ROSE, nello spazio che avanza sulla linea dei portieri (sua richiesta, 22/09/2026).
             Proiettate e non disegnate qui: dov'e' lo spazio lo sa questa griglia, cosa ci va lo sa la
             pagina. Sta DENTRO la linea e non sopra o sotto, cosi' le dieci card sono alte quanto un
             blocco e la plancia si riprende i 240px che la colonna di destra le toglieva. -->
        @if (role === 'P') {
          <!-- DENTRO UNA CARD, e non appoggiate sul fondo (sua richiesta, 22/09/2026: «per rendere
               più evidente il cambio di contesto dai calciatori»). Senza un contenitore suo la
               striscia sta nella stessa griglia dei blocchi e si legge come un sesto blocco della
               linea dei portieri: stessa distanza, stesso fondo, nessun bordo a dire dove finisce il
               listone e cominciano le rose.

               IL FONDO E' `surface` E NON `page`, e la differenza non e' di gusto: dietro c'e' la
               PAGINA, che e' `page`, quindi una card di quel colore non si stacca da niente e resta
               un bordo da un pixel. `surface` e' il gradino che i blocchi usano gia' per leggersi
               come card (dieci punti per canale sopra la pagina), e lascia libero `control`, che e'
               come una rosa RIVALE si accende dentro. Nessuna tinta: il colore qui e' gia' preso -
               e' l'identita' di una rosa - e spenderlo due volte lo spegnerebbe. -->
          <div
            class="flex min-h-0 min-w-0 flex-col overflow-hidden rounded-lg border border-border bg-surface p-1.5"
            [style.grid-column]="'span ' + teamsSpan()"
          >
            <ng-content select="[spare]" />
          </div>
        }
      </div>
    </div>
  }
</div>
