<!-- UI text is ITALIAN in app/ (see app/CLAUDE.md); code and comments stay English.

     UN MARCHIO PER EVENTO, scelto sul `kind` e mai sull'etichetta. Il conteggio si stampa solo quando è
     più di uno: «1» accanto a un pallone è rumore, «2» è un fatto. -->
<span
  class="inline-flex items-center gap-px leading-none"
  [class]="ink()"
  nz-tooltip
  [nzTooltipMouseEnterDelay]="0.3"
  [nzTooltipTitle]="hint()"
>
  @if (bonus().count > 1 || always()) {
    <span class="font-semibold tabular-nums" [class]="countSize()">{{ bonus().count }}</span>
  }

  @switch (bonus().kind) {
    <!-- IL PALLONE: verde se l'ha fatto, rosso se se l'è fatto da solo. Un SVG e non un `nz-icon`,
         perché antd non ha un pallone - e un'emoji come icona questo progetto non la usa. -->
    @case ('goal') {
      <ng-container [ngTemplateOutlet]="ball" />
    }
    @case ('own-goal') {
      <ng-container [ngTemplateOutlet]="ball" />
    }
    <!-- LA SCARPETTA: l'assist, di piede o da fermo che sia. -->
    @case ('assist') {
      <svg viewBox="0 0 24 24" [class]="glyph()" aria-hidden="true">
        <path
          d="M3.6 16.2c0-2.2.6-4.3 1.7-6.1.3-.6 1-.8 1.6-.6l1.7.5c.5.2.9.6 1 1.2l.3 1.7 6.7 2.2c1.5.5 2.5 1.9 2.5 3.5v.6c0 .3-.3.6-.6.6H4.2c-.3 0-.6-.3-.6-.6z"
          fill="currentColor"
        />
      </svg>
    }
    <!-- IL BERSAGLIO: il rigore, verde segnato e rosso sbagliato. -->
    @case ('pen-scored') {
      <nz-icon [class]="icon()" nzType="aim" nzTheme="outline" />
    }
    @case ('pen-missed') {
      <nz-icon [class]="icon()" nzType="aim" nzTheme="outline" />
    }
    <!-- I DUE CARTELLINI: due rettangolini, che è come si vedono in campo. Nessuna icona: la forma È
         il significato, e un giallo che non fosse un rettangolo non sarebbe un cartellino. -->
    @case ('yellow') {
      <span class="inline-block rounded-[1px] bg-warning" [class]="card()" aria-label="ammonizione"></span>
    }
    @case ('red') {
      <span class="inline-block rounded-[1px] bg-danger" [class]="card()" aria-label="espulsione"></span>
    }
    <!-- I DUE DEL PORTIERE: una x per il gol subito, un check per il rigore parato. -->
    @case ('conceded') {
      <nz-icon [class]="icon()" nzType="close-circle" nzTheme="outline" />
    }
    @case ('pen-saved') {
      <nz-icon [class]="icon()" nzType="check-circle" nzTheme="outline" />
    }
  }
</span>

<!-- Il pallone, disegnato una volta e usato dai due casi che lo vogliono: due copie dello stesso
     tracciato sono come due pagine finiscono per avere due palloni diversi. -->
<ng-template #ball>
  <svg viewBox="0 0 24 24" [class]="glyph()" aria-hidden="true">
    <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2" />
    <path d="M12 6.8l4 2.9-1.5 4.7h-5L8 9.7z" fill="currentColor" />
  </svg>
</ng-template>
