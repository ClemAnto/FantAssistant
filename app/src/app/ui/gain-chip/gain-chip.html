<!-- QUADRATO SMUSSATO, come il punteggio di `ui-stars`: una fila di riquadri uguali si scorre a colpo
     d'occhio, mentre larghezze diverse fanno leggere la forma invece del colore.

     NESSUN `title`, e non e' una dimenticanza: ogni riquadro di questa pagina sta dentro un popover che
     apre le due stagioni del giocatore, e il tooltip nativo del browser gli si accavallava sopra. Una
     cosa sola sotto il dito - la spiegazione di cosa sia il GAIN e la sua fascia stanno DENTRO quel
     popover, dove c'e' lo spazio per dirle. -->
@if (band() === 'ignoto') {
  <span class="text-muted">&mdash;</span>
} @else {
  <span
    class="inline-flex items-center justify-center rounded-md px-1 font-medium tabular-nums"
    [class]="box() + ' ' + tone()"
    >{{ gain() | number: format() }}</span
  >
}
