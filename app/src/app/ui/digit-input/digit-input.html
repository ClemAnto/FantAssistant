<!-- UI text is ITALIAN in app/ (see app/CLAUDE.md); code and comments stay English.

     UN ODOMETRO: le cifre sono ATTACCATE fra loro e le freccette stanno sopra e sotto la propria. Senza
     lo spazio nullo fra le colonne quattro cifre si leggerebbero come quattro numeri - e' la stessa
     ragione per cui i due numeri della lente si compongono in una stringa sola, uno spazio in mezzo a
     delle cifre le fa leggere separate.

     LA TAGLIA E' SUA (23/09/2026: «ingrandisci questo componente»): la colonna passa da 15 a 22px, la
     cifra da 11 a 16 e il tastino da 20 a 28, cioe' tutto di circa la meta'. Le PROPORZIONI restano,
     perche' quello che si ingrandisce e' un oggetto solo: una cifra piu' grande con le stesse freccette
     leggerebbe come due controlli accostati invece che come un odometro.

     LE FRECCETTE SONO BOTTONI VERI e non due triangoli disegnati: le preme un puntatore, le raggiunge il
     tabulatore, e quando non possono fare niente sono `disabled` - un bottone che si preme senza effetto
     e' indistinguibile da un bottone rotto. -->
<span class="flex items-center gap-1">
  <span class="flex items-stretch rounded border border-border bg-surface">
    @for (place of places(); track place) {
      <span
        class="flex w-[22px] flex-col items-center"
        data-column
        (wheel)="wheel(place, $event)"
      >
        <button
          type="button"
          data-step="up"
          class="flex h-[13px] w-full items-center justify-center leading-none text-muted hover:bg-control hover:text-fg disabled:opacity-25 disabled:hover:bg-transparent"
          [disabled]="blocked(place, 1)"
          [attr.aria-label]="label(place, 1)"
          (click)="step(place, 1)"
        >
          <nz-icon class="text-[10px]" nzType="caret-up" />
        </button>
        <!-- LA CIFRA E' UN CAMPO e non un'etichetta: cosi' si puo' anche BATTERE, che e' la meta' che la
             richiesta non nomina e senza la quale arrivare a 137 da zero costerebbe undici click.
             `inputmode` numerico perche' su un telefono la tastiera giusta e' quella, e `maxlength` uno
             perche' il posto ne tiene una sola - quello che si batte SOSTITUISCE, non si accoda. -->
        <input
          #cell
          data-digit
          type="text"
          inputmode="numeric"
          maxlength="1"
          class="w-full bg-transparent text-center text-[16px] leading-none font-semibold tabular-nums text-fg outline-none focus:bg-control"
          [value]="digit(place)"
          [attr.aria-label]="'cifra da ' + place"
          (input)="typed(place, $event)"
          (keydown)="key(place, $event)"
          (focus)="cell.select()"
        />
        <button
          type="button"
          data-step="down"
          class="flex h-[13px] w-full items-center justify-center leading-none text-muted hover:bg-control hover:text-fg disabled:opacity-25 disabled:hover:bg-transparent"
          [disabled]="blocked(place, -1)"
          [attr.aria-label]="label(place, -1)"
          (click)="step(place, -1)"
        >
          <nz-icon class="text-[10px]" nzType="caret-down" />
        </button>
      </span>
    }
  </span>

  <!-- IL TASTINO CHE AZZERA, fuori dall'odometro: sta accanto alle cifre e non dentro, o si leggerebbe
       come una quinta colonna. `rollback` e' lo stesso marchio con cui la pagina azzera le rose - una
       cosa sola vista due volte, invece di due segni per lo stesso gesto. -->
  <button
    type="button"
    data-reset
    class="flex h-7 w-7 shrink-0 items-center justify-center rounded border border-border text-[13px] text-muted hover:bg-control hover:text-fg disabled:opacity-25"
    [disabled]="!value()"
    nz-tooltip
    [nzTooltipTitle]="'Azzera ' + what()"
    [attr.aria-label]="'azzera ' + what()"
    (click)="reset()"
  >
    <nz-icon nzType="rollback" />
  </button>
</span>
