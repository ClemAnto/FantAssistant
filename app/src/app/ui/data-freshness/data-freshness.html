<!-- UI text is ITALIAN in app/ (see app/CLAUDE.md); code and comments stay English.

     Sta dentro la barra delle opzioni globali e non in una scatola sua: due riquadri fissi nello stesso
     angolo si coprono, e questo deve stare a schermo SEMPRE - non essere una terza cosa da cercare. -->
<span
  class="flex items-center gap-1 rounded-md px-2 py-0.5 font-medium"
  [class]="tone()"
  nz-tooltip
  [nzTooltipTitle]="hint()"
  nzTooltipOverlayClassName="whitespace-pre-line"
>
  <nz-icon [nzType]="icon()" />
  @if (stale()) {
    <!-- La parola dice la CONSEGUENZA e non l'età: «vecchi di 5 giorni» non fa capire che gli allarmi
         non compaiono più, «allarmi spenti» sì. -->
    <span>allarmi spenti · {{ label() }}</span>
  } @else {
    <span>dati {{ label() }}</span>
  }
  <!-- L'INTERRUTTORE NOTTURNO, e solo quando e' SPENTO: un glifo in piu' che dice perche' domani
       queste date saranno di un giorno piu' vecchie. Acceso non disegna niente, per la stessa ragione
       per cui «tutto di oggi» non ha colore - «va bene» non e' una notizia. Non tinge la pastiglia:
       il rosso qui significa gia' «allarmi spenti», e dare due significati a un colore e' come uno
       schermo finisce per non dirne nessuno. -->
  @if (off()) {
    <!-- `poweroff` e non `moon`: la seconda non e' nel set predefinito di ng-zorro, e un'icona non
         registrata disegna il VUOTO senza dire niente (04/09/2026, il caso della lente). -->
    <nz-icon class="opacity-70" nzType="poweroff" data-nightly-off />
  }
</span>
