@if (badge(); as src) {
  <img
    [src]="src"
    [alt]="club() ?? 'Squadra ignota'"
    [title]="club() ?? 'Squadra ignota'"
    [class]="shape() + ' ' + inset() + ' shrink-0 rounded-full bg-white/5 object-contain'"
    loading="lazy"
  />
} @else if (fallback() === 'shield') {
  <!-- LO SCUDO GRIGIO: stessa taglia e stessa forma degli stemmi veri, così una colonna di stemmi resta
       una colonna. Dice «non ho il suo stemma» e non finge di essere uno stemma. -->
  <span
    class="inline-flex shrink-0 items-center justify-center rounded-full bg-control text-muted"
    [class]="shape()"
    [title]="club() ?? 'Squadra ignota'"
  >
    <svg viewBox="0 0 24 24" class="h-3/5 w-3/5" aria-hidden="true">
      <path d="M12 2.8l7 2.4v6c0 4.3-2.9 8.2-7 10-4.1-1.8-7-5.7-7-10v-6z" fill="currentColor" />
    </svg>
  </span>
} @else {
  <span
    class="inline-flex shrink-0 items-center justify-center rounded-full font-semibold leading-none text-white"
    [class]="shape()"
    [style.background-color]="colour()"
    [title]="club() ?? 'Squadra ignota'"
    >{{ initials() }}</span
  >
}
